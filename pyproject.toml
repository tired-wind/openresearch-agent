[project]
name = "openresearch-agent"
version = "0.1.0"
description = "Evidence-grounded research workflow: auditable local MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.18",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "langgraph>=1.0,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
